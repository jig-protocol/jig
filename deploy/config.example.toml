# /etc/jig/config.toml — jig-server, tailnet deployment
#
# Every key in this file is checked. jig-server refuses to start on a key it
# does not know, naming the key, so a typo or a key in the wrong section fails
# loudly instead of silently keeping a default. A key jig-server used to accept
# and no longer does fails with a message saying so.
#
#   * ROOT-LEVEL keys (database_path, bind_address, port, [tls], [execution])
#       open the socket and size the block runtime.
#   * [server] / [identity] / [auth] / [debug] / [federation] / [bridges]
#       configure identity, auth, federation and bridges.

# ============================================================================
# Root keys  —  what actually opens the socket
# ============================================================================

database_path = "/var/lib/jig/jig.db"

# THE REAL BIND ADDRESS. Set this to this host's Tailscale IP (`tailscale ip -4`).
# NOT 0.0.0.0. The server authenticates every read and enforces channel
# membership on its own (see [auth] below), and rate-limits each key and
# address, but by default it admits any key — so the tailnet stays the outer
# layer. See deploy/README.md "Security model".
bind_address = "100.x.y.z"
port = 7117

# TLS is on by default. With no cert_path/key_path the server makes a
# self-signed certificate on first start (/var/lib/jig/tls/) and its DID
# vouches for it at /.well-known/jig; jig clients and peers trust it through
# that DID. For a certificate browsers and curl trust too, with no certbot and
# no public DNS — see deploy/README.md:
#   tailscale cert <host>.<tailnet>.ts.net
# [tls]
# cert_path = "/var/lib/jig/tls/<host>.<tailnet>.ts.net.crt"
# key_path  = "/var/lib/jig/tls/<host>.<tailnet>.ts.net.key"
# Plaintext, for loopback or local testing only. A remote client over TLS
# refuses a server whose welcome is not bound to its TLS session, so anything
# in front of jig-server must pass TLS through (TCP or SNI passthrough), not
# terminate it:
# enabled = false

# SET THIS WHEN YOU SERVE A CERTIFICATE ISSUED FOR A HOSTNAME. It is the
# origin advertised at /.well-known/jig. Left unset, the server derives
# {scheme}://{bind_address}:{port}, and bind_address is an IP: jig clients and
# peers still trust the certificate through the server DID, but anything else
# that follows the advertisement (a browser, curl) gets a certificate-name
# mismatch. Must appear BEFORE any [table] header (it is a root key).
# public_url = "https://<host>.<tailnet>.ts.net:7117"

# ============================================================================
# Pipeline sections  —  identity, auth, federation, bridges
# ============================================================================

[server]
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# `listen` HERE IS DECORATIVE. IT DOES NOT CONTROL THE BIND ADDRESS.
# Its only job is building the `ws://{listen}` origin-tag string stamped onto
# blocks and returned by the admin endpoints. Changing it moves nothing; the
# socket is opened from the ROOT-LEVEL bind_address/port above.
# Keep it in sync with them anyway, or clients will be handed an origin URL
# that points somewhere the server isn't.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
listen = "100.x.y.z:7117"

# The ed25519 seed the server DID is derived from, sealed: this path names
# /var/lib/jig/server.jigkey beside it. BACK IT UP OFFSITE, with a way to open
# it (deploy/README.md). Losing it changes the server DID and breaks TOFU
# pinning for every client. A raw server.key from an older release is refused
# until `jig-server keys seal` converts it.
server_did_keyfile = "/var/lib/jig/server.key"

# channel-create, member-add and channel-archive are not optional extras:
# `jig channel create`, `jig channel join` and `jig channel delete` submit
# exactly these kinds, and a channel cannot be bootstrapped or retired any
# other way until v0.0.3+ ships Wasm-executed channel ops. channel-archive is
# owner-gated against channels.owner_did, so listing it does not let anyone
# else retire your channels. member-remove (`jig channel kick` / `leave`) and
# channel-promote (`jig channel promote`) are the v0.2 channel dynamics, gated
# the same way.
allowed_block_kinds = ["text-render", "channel-create", "member-add", "member-remove", "channel-promote", "channel-archive"]

[identity]
# tofu = trust the first key seen for a DID and pin it. No nameserver required.
# Switch to "nameserver" once a nameserver is the source of truth for handles,
# and list each alias suffix under [identity.delegations]: the DIDs whose
# attestations count for it and the nameserver URLs to ask, e.g.
#   [identity.delegations."example.org"]
#   authorities = ["did:jig:..."]
#   nameservers = ["https://ns.example"]
# An alias whose suffix has no entry is refused, except under the default
# suffix (alice@jig): the server ships the jig delegation built in, once the
# project authority DID is published, and an [identity.delegations.jig] entry
# here overrides it. trusted_nameservers is not used to resolve aliases.
mode = "tofu"
trusted_nameservers = []
cache_ttl_seconds = 300
naively_allow_unknown_handles_fallback = false

[auth]
# Every read (REST and WSS) carries a signed proof of possession, and
# restricted channels are enforced against membership. `false` disables both
# and exists only to migrate a deployment whose clients cannot sign yet; it is
# advertised in unsafe_options_active while set.
require_authenticated_reads = true
replay_window_ms = 30000
replay_capacity = 100000

# Gate 2: whom this server deals with at all, decided after a caller proves
# their key and before anything is authorized. The default admits everyone.
# Reputation is ruleset-scoped: a floor names its ruleset, and a DID with no
# score under it is UNKNOWN for it — decided by `unknown_dids`, never by the
# number. `unknown_dids = "refuse"` plus `records` is a members-only server.
# `unknown_dids = "proof-of-work"` admits a new DID once it has done `pow_bits`
# of work for this server (`POST /api/v1/admission`; the CLI does it on first
# contact). Each bit doubles the cost; 20 is under a second on a laptop and
# much less on a GPU, so it is a speed bump for identity floods, not a wall.
[auth.admission]
unknown_dids = "admit"
# pow_bits = 20
banned_dids = []
# [[auth.admission.floors]]
# ruleset_key = "jig.highsec.v1"
# minimum = 0
# [[auth.admission.records]]
# did = "did:jig:z..."
# ruleset_key = "jig.highsec.v1"
# score = 5

# Token buckets in front of the gates, per verified DID and per remote
# address; a rate of 0 turns that limit off. Behind a reverse proxy (Caddy,
# nginx, tailscale serve) every request comes from the proxy's address, so
# raise per_ip_* or set per_ip_per_second = 0 there.
[auth.rate_limit]
per_did_burst = 300
per_did_per_second = 50
per_ip_burst = 600
per_ip_per_second = 100
replay_per_did = 2000

[keys]
# What opens the sealed server key at boot. The server never prompts. The
# systemd credential in jig-server.service (LoadCredentialEncrypted=), bound to
# the TPM where there is one, is the recommended slot: see deploy/README.md,
# "Sealing the server key", for what each choice protects against. With none
# set, a new key is refused rather than written in clear.
unlock = "credential:/run/credentials/jig-server.service/jig-server-key"
storage = "sealed"

[debug]
# Handle enumeration stays off — it dumps the registry to any caller.
list_handles = false

# [federation]
# dangerously_disable_federation_tls = false
# A `ws://` (plaintext) peer URL stops the boot unless this is set. The peer's
# DID is still checked at the handshake, but nothing after it is protected;
# the flag is advertised in /.well-known/jig. Prefer wss://.
# dangerously_allow_plaintext_federation = false
# Listing a peer is what trusts it: this server dials `url` (it appends
# /api/v1/ws), refuses a welcome signed by any DID but `expected_did`, and
# lets only listed DIDs subscribe to its own federation stream. Both servers
# list each other.
# [[federation.peers]]
# url = "wss://peer.example.ts.net:7117"
# expected_did = "did:jig:..."

# [bridges]
# Deny-by-default: with no allow_list and no per_bridge entry, no bridge loads.
# Bridge secrets come from the systemd EnvironmentFile via ${VAR} expansion —
# never write a literal key into this file.
# allow_list = ["email"]
# [bridges.per_bridge.email]
# enabled = true
# [bridges.per_bridge.email.config]
# bridge_secret = "${JIG_BRIDGE_SECRET}"
# resend_api_key = "${RESEND_API_KEY}"
