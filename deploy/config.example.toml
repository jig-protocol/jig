# /etc/jig/config.toml — jig-server, tailnet deployment
#
# ############################################################################
# # THIS IS ONE FILE FEEDING TWO DIFFERENT CONFIG STRUCTS. READ THIS PART.   #
# ############################################################################
#
# jig-server's main.rs loads the SAME --config path twice, into two unrelated
# types:
#
#   * ROOT-LEVEL keys (database_path, bind_address, port, [tls], [execution])
#       -> jig_server::ServerConfig      <- THIS IS WHAT ACTUALLY BINDS
#   * [server] / [identity] / [federation] / [debug] / [bridges]
#       -> jig_config::v0_0_2_server::JigServerConfig
#
# Neither type uses serde(deny_unknown_fields), so each one silently ignores
# the other's sections. That is what makes one file legal — and it is also why
# a typo or a value set in the wrong place fails SILENTLY instead of erroring.
# When something "isn't taking effect", check which of the two halves you edited.

# ============================================================================
# ServerConfig  —  the half that actually opens the socket
# ============================================================================

database_path = "/var/lib/jig/jig.db"

# THE REAL BIND ADDRESS. Set this to this host's Tailscale IP (`tailscale ip -4`).
# NOT 0.0.0.0. The server authenticates every read and enforces channel
# membership on its own (see [auth] below), but nothing yet limits WHO may
# reach the gates — any key is admitted, unthrottled — so the tailnet stays
# the outer layer. See deploy/README.md "Security model".
bind_address = "100.x.y.z"
port = 7117

# Optional real TLS with no certbot and no public DNS — see deploy/README.md:
#   tailscale cert <host>.<tailnet>.ts.net
# [tls]
# enabled = true
# cert_path = "/var/lib/jig/tls/<host>.<tailnet>.ts.net.crt"
# key_path  = "/var/lib/jig/tls/<host>.<tailnet>.ts.net.key"

# SET THIS WHENEVER YOU ENABLE [tls]. It is the origin advertised at
# /.well-known/jig for federated peers to dial. Left unset, the server derives
# {scheme}://{bind_address}:{port} — the scheme now follows [tls], but
# bind_address is an IP while your certificate is issued for a HOSTNAME, so a
# peer that follows the advertisement gets a certificate-name mismatch instead
# of a useful error. Must appear BEFORE any [table] header (it is a root key).
# public_url = "https://<host>.<tailnet>.ts.net:7117"

# ============================================================================
# JigServerConfig  —  the v0.0.2 half
# ============================================================================

[server]
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# `listen` HERE IS DECORATIVE. IT DOES NOT CONTROL THE BIND ADDRESS.
# Its only job is building the `ws://{listen}` origin-tag string stamped onto
# blocks and returned by the admin endpoints. Changing it moves nothing; the
# socket is opened from the ROOT-LEVEL bind_address/port above.
# Keep it in sync with them anyway, or clients will be handed an origin URL
# that points somewhere the server isn't.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
listen = "100.x.y.z:7117"

# The ed25519 seed the server DID is derived from. BACK THIS UP OFFSITE.
# Losing it changes the server DID and breaks TOFU pinning for every client.
# The server generates it 0600 on first boot and REFUSES TO START if the file
# is later group- or other-readable.
server_did_keyfile = "/var/lib/jig/server.key"

# channel-create, member-add and channel-archive are not optional extras:
# `jig channel create`, `jig channel join` and `jig channel delete` submit
# exactly these kinds, and a channel cannot be bootstrapped or retired any
# other way until v0.0.3+ ships Wasm-executed channel ops. channel-archive is
# owner-gated against channels.owner_did, so listing it does not let anyone
# else retire your channels.
allowed_block_kinds = ["text-render", "channel-create", "member-add", "channel-archive"]

[identity]
# tofu = trust the first key seen for a DID and pin it. No nameserver required.
# Switch to "nameserver" (and populate trusted_nameservers) once the tailnet
# nameserver on :7070 is the source of truth for handles.
mode = "tofu"
trusted_nameservers = []
cache_ttl_seconds = 300
naively_allow_unknown_handles_fallback = false

[auth]
# Every read (REST and WSS) carries a signed proof of possession, and
# restricted channels are enforced against membership. `false` disables both
# and exists only to migrate a deployment whose clients cannot sign yet; it is
# advertised in unsafe_options_active while set.
require_authenticated_reads = true
replay_window_ms = 30000
replay_capacity = 100000

# Gate 2: whom this server deals with at all, decided after a caller proves
# their key and before anything is authorized. The default admits everyone.
# Reputation is ruleset-scoped: a floor names its ruleset, and a DID with no
# score under it is UNKNOWN for it — decided by `unknown_dids`, never by the
# number. `unknown_dids = "refuse"` plus `records` is a members-only server.
[auth.admission]
unknown_dids = "admit"
banned_dids = []
# [[auth.admission.floors]]
# ruleset_key = "gigue.highsec.v1"
# minimum = 0
# [[auth.admission.records]]
# did = "did:jig:z..."
# ruleset_key = "gigue.highsec.v1"
# score = 5

[debug]
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# REQUIRED FOR v0.0.2. `admin_endpoints = false` does not mount the
# /_admin_v0_0_2/* router, and then `jig channel create` / `jig channel join`
# fail with a bare 404 that looks like a wrong URL, a wrong port, or a broken
# build. It is none of those — it is this line.
# These routes run the same signature and ownership checks as every other
# submit path; the flag is a label, not a bypass.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
admin_endpoints = true
# Handle enumeration stays off — it dumps the registry to any caller.
list_handles = false

# [federation]
# dangerously_disable_federation_tls = false
# [[federation.peers]]
# url = "wss://peer.example.ts.net:7117/v0_0_2/federation"
# expected_did = "did:jig:..."

# [bridges]
# Deny-by-default: with no allow_list and no per_bridge entry, no bridge loads.
# Bridge secrets come from the systemd EnvironmentFile via ${VAR} expansion —
# never write a literal key into this file.
# allow_list = ["email"]
# [bridges.per_bridge.email]
# enabled = true
# [bridges.per_bridge.email.config]
# bridge_secret = "${JIG_BRIDGE_SECRET}"
# resend_api_key = "${RESEND_API_KEY}"
