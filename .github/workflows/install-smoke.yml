name: Install smoke

# Fails if `curl … install.sh | bash` takes more than 60s to reach
# "hello, world" in #hello on a local jig-server.
#
# * tag given (release.yml after publish, or manual dispatch): installs the
#   published GitHub Release on Linux x86_64 and Apple Silicon macOS — the
#   real end-user path, CDN included.
# * pull_request touching the installer: builds the PR's binaries, signs them
#   with a throwaway key, and installs from a local mirror with the PR's
#   install.sh.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to install
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install ("latest" = newest, prereleases included)
        required: true
        default: latest
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - install.sh
      - scripts/install-smoke.sh
      - scripts/package-release.sh
      - .github/workflows/install-smoke.yml
      - .github/workflows/release.yml
      - repos/jig-cli/src/cmd/channel.rs
      - repos/jig-server/src/v0_0_2_admin.rs
      - repos/jig-server/src/v0_0_2_ws.rs
      - repos/jig-server/src/v0_0_2_ingest_error.rs
      - repos/jig-server/src/config.rs
      - repos/jig-server/src/main.rs
      - repos/jig-config/src/v0_0_2_server.rs
      - repos/jig-pipeline/src/ingest.rs
      # How `jig init` seals and unlocks keys (I1): a change here can break a
      # headless install.
      - repos/jig-core/src/keystore.rs
      - repos/jig-client/src/identity.rs
      - repos/jig-client/src/keychain.rs
      - repos/jig-client/src/secure.rs
      - repos/jig-cli/src/cmd/init.rs
      - repos/jig-cli/src/cmd/passphrase.rs
      - scripts/test-install-key-fallback.sh

permissions:
  contents: read

# A new push to a pull request supersedes its running smoke test.
concurrency:
  group: install-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  published:
    name: published ${{ inputs.tag }} on ${{ matrix.runs_on }}
    if: inputs.tag != ''
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runs_on: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: curl | bash → hello-world (budget 60s)
        shell: bash
        env:
          JIG_VERSION: ${{ inputs.tag }}
          # Not needed for a public repo; it raises the API rate limit.
          JIG_GITHUB_TOKEN: ${{ github.token }}
          JIG_VERIFY_SIGNATURE: '1'
        run: scripts/install-smoke.sh 60

  pr:
    name: PR build on ubuntu-24.04
    # Drafts skip it; marking the PR ready for review runs it.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: install.sh key fallback (stub jig; terminal and headless)
        shell: bash
        run: scripts/test-install-key-fallback.sh
      - name: Install Rust toolchain
        shell: bash
        working-directory: repos
        run: |
          set -euo pipefail
          if [ -f ../rust-toolchain.toml ] || [ -f rust-toolchain.toml ]; then
            rustup toolchain install --profile minimal
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
          key: install-smoke
      - name: Build
        working-directory: repos
        run: |
          # jig-nameserver alone, so it links no wasmtime (see release.yml).
          cargo build --release --locked -p jig-server -p jig-cli
          cargo build --release --locked -p jig-nameserver
      - name: Package, checksum, sign with a throwaway key, serve
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh x86_64-unknown-linux-gnu jig-linux-x86_64 dist
          cp install.sh dist/
          key="$RUNNER_TEMP/k"
          ssh-keygen -q -t ed25519 -N '' -C jig-release -f "$key"
          (cd dist && sha256sum jig-*.tar.gz install.sh > SHA256SUMS && ssh-keygen -Y sign -q -f "$key" -n jig-release SHA256SUMS)
          echo "signer=jig-release namespaces=\"jig-release\" $(cut -d' ' -f1,2 "$key.pub")" >> "$GITHUB_OUTPUT"
          (cd dist && nohup python3 -m http.server 47391 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:47391/SHA256SUMS && exit 0; sleep 0.1; done
          exit 1
      - name: curl | bash → hello-world (budget 60s)
        shell: bash
        env:
          JIG_INSTALL_SH_URL: http://127.0.0.1:47391/install.sh
          JIG_RELEASES_BASE: http://127.0.0.1:47391
          JIG_VERIFY_SIGNATURE: '1'
          JIG_RELEASE_SIGNER: ${{ steps.mirror.outputs.signer }}
        run: scripts/install-smoke.sh 60
      # SC-02: without ssh-keygen the installer must refuse, not fall back to
      # the checksum alone. alpine:3.20 without openssh-keygen has none.
      # JIG_NO_START=1: the binaries are glibc builds and are never run here.
      - name: fails closed without ssh-keygen; JIG_VERIFY_SIGNATURE=0 overrides
        shell: bash
        run: |
          set -euo pipefail
          run() {
            docker run --rm --network host -e JIG_RELEASES_BASE=http://127.0.0.1:47391 \
              -e JIG_NO_START=1 -e JIG_NONINTERACTIVE=1 "$@" alpine:3.20 sh -c \
              'apk add --no-cache bash curl >/dev/null && curl -fsSL "$JIG_RELEASES_BASE/install.sh" | bash' 2>&1
          }
          if out=$(run); then
            echo "$out"; echo "install.sh installed without ssh-keygen" >&2; exit 1
          fi
          echo "$out"
          grep -q 'ssh-keygen (OpenSSH >= 8.1) is not installed' <<<"$out"
          out=$(run -e JIG_VERIFY_SIGNATURE=0)
          echo "$out"
          grep -q 'JIG_VERIFY_SIGNATURE=0: skipping signature check' <<<"$out"
          grep -q 'checksum OK' <<<"$out"
