name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The RustSec advisory DB moves independently of this repo, so a brand-new
  # advisory against an untouched dependency would otherwise first surface as a
  # red build on whatever unrelated PR happens to run next (this has already
  # happened once). Run the dependency-policy job on its own cadence against the
  # default branch so drift is attributed to the advisory DB, not a contributor.
  # NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
  schedule:
    - cron: '17 7 * * *'  # daily 07:17 UTC; off-the-hour to dodge cron peak queueing

# All cargo invocations expect to be run from the `repos/` workspace root.
# The dependency-policy job is the exception — `deny.toml` lives at the repo root.
defaults:
  run:
    working-directory: repos

# jig-nameserver's config tests require this env var to construct.
# Test value is fine; CI doesn't talk to a real nameserver.
env:
  JIG_NS_SECRET: ci_dummy_jig_ns_secret_not_a_real_value

jobs:
  workspace:
    # The scheduled run exists only to re-check the advisory DB; skip the
    # expensive build/test matrix on that trigger.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Format (v0.0.2 surface)
        # Scoped to v0.0.2-touched crates. jig-spec and jig-gui/* may still have
        # upstream formatting drift and are not gated. jig-bridge-email is
        # first-class (alpha.email rewrote it as an in-process library), and
        # jig-runtime joined the gate when the byte-payload convention landed
        # there — it is verified clean, and it is no longer a crate we can afford
        # to leave unchecked now that block execution lives in it.
        run: |
          cargo fmt --check \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Clippy (v0.0.2 surface)
        # All clippy lints enforced; alpha.1c #10 cleaned up the legacy
        # v0.0.1 lint debt that the previous `-A` mute list was carrying.
        run: |
          cargo clippy \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            --all-targets \
            -- -D warnings
      - name: Clippy (jig-bridge-core web feature)
        # The webhook-mount path (RouterMount + cfg'd BridgeContext field) is
        # gated behind the `web` feature; lint it explicitly so it's covered.
        run: cargo clippy -p jig-bridge-core --all-targets --features web -- -D warnings
      - name: Clippy (jig-bridge-email)
        # alpha.email's in-process EmailBridge. --all-targets so its substantial
        # test modules (provider/inbound/outbound/bridge) are linted too.
        run: cargo clippy -p jig-bridge-email --all-targets -- -D warnings
      - name: Nextest (v0.0.2 surface)
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Nextest (jig-bridge-core web feature)
        run: cargo nextest run -p jig-bridge-core --features web

  wasm-build:
    name: wasm-build (text-block, wasm32-unknown-unknown)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # NOT wasm32-wasip1. text-block is a pure function; the
          # unknown-unknown target emits a module with no imports, which is what
          # lets jig-runtime instantiate it under a no-imports policy. A wasip1
          # build imports wasi_snapshot_preview1 and gets rejected at load.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
          key: wasm32-unknown-unknown
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      # The committed artifact is what jig-pipeline embeds and executes, so it
      # has to be the artifact this source actually produces. Rebuild it and
      # require byte-identity: otherwise the module that runs in production can
      # drift from the code reviewers read, and `render_hash` provenance —
      # the whole point of the module identity — becomes a guess.
      #
      # build-artifact.sh also fails on any float instruction in the module,
      # which is what a switch back to serde_json would reintroduce.
      - name: Rebuild the canonical artifact
        working-directory: repos
        run: ./text-block/build-artifact.sh
      - name: Committed artifact must match a fresh build
        working-directory: .
        run: |
          if ! git diff --exit-code -- repos/text-block/artifacts/text_block.wasm; then
            echo "::error::repos/text-block/artifacts/text_block.wasm is stale."
            echo "Run repos/text-block/build-artifact.sh and commit the result."
            exit 1
          fi
          echo "committed artifact matches a fresh build"

  # Renamed from `license-compliance`: bare `cargo deny check` runs ALL FOUR
  # checks (advisories, bans, licenses, sources). The old name once sent a
  # failure investigation at the licenses check when the actual red was
  # advisories. Name the job after what it runs.
  dependency-policy:
    name: dependency-policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check (advisories, bans, licenses, sources)
        # deny.toml lives at the repo root; Cargo.toml lives at repos/Cargo.toml.
        # Run from root and point cargo deny at the workspace manifest explicitly.
        # Running from inside repos/ makes cargo-deny silently fall back to its
        # DEFAULT config (allows no licenses, ignores nothing) — do not "fix"
        # this by dropping the working-directory override.
        working-directory: .
        run: cargo deny --manifest-path repos/Cargo.toml check
