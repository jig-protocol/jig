name: CI

on:
  push:
    branches: [ main ]
  # The merge queue is the gate that cannot be skipped: every queued group runs
  # the full suite on exactly the tree that lands on main.
  merge_group:
  # Pull requests run the expensive jobs only when they could matter (see the
  # `changes` job): not on drafts, and not when only docs changed. Marking a
  # draft ready (`ready_for_review`) runs them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A full run on any branch, on demand (for example a draft that wants CI).
  workflow_dispatch:
  # The RustSec advisory DB moves independently of this repo, so a brand-new
  # advisory against an untouched dependency would otherwise first surface as a
  # red build on whatever unrelated PR happens to run next (this has already
  # happened once). Run the dependency-policy job on its own cadence against the
  # default branch so drift is attributed to the advisory DB, not a contributor.
  # NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
  schedule:
    - cron: '17 7 * * *'  # daily 07:17 UTC; off-the-hour to dodge cron peak queueing

# A new push to a pull request supersedes its running CI. Merge-queue groups,
# main and scheduled runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All cargo invocations expect to be run from the `repos/` workspace root.
# The dependency-policy job is the exception — `deny.toml` lives at the repo root.
defaults:
  run:
    working-directory: repos

jobs:
  # Pull requests only: does this PR change anything a build could see? Docs
  # (`*.md` anywhere, `docs/**`) and repo metadata do not; everything else does,
  # including Cargo.lock, rust-toolchain.toml, deny.toml and workflows. Nothing
  # in the workspace embeds a markdown file (no include_str! of one), so a
  # docs-only PR cannot change what compiles.
  #
  # `workspace` and `wasm-build` are required checks. A job skipped by its
  # `if:` reports success, which is what lets a docs-only PR merge; a job that
  # never reports would block the merge forever. If this job fails, the
  # dependent jobs run anyway (fail open to running, never to skipping).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          code=false
          while IFS= read -r f; do
            case "$f" in
              '' | *.md | docs/* | LICENSE* | .github/ISSUE_TEMPLATE/* | .github/CODEOWNERS | .coderabbit.yaml) ;;
              *) code=true; echo "code change: $f"; break ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  workspace:
    # The scheduled run exists only to re-check the advisory DB; skip the
    # expensive build/test matrix on that trigger. On a pull request, run only
    # when it is ready for review and touches code (see `changes`).
    needs: changes
    if: >-
      ${{ !cancelled() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        (needs.changes.result != 'success' || needs.changes.outputs.code == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Swatinem/rust-cache saves to the Actions cache API.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        # Channel, components and targets all come from rust-toolchain.toml at
        # the repo root, so CI builds with exactly what a contributor gets.
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Test-only suites stay out of every build
        # `test-aead` (jig-core `test-suite`) and long-lived MLS leaves
        # (jig-mls `conformance`) exist for the conformance vectors only, and
        # jig-core `test-default-authority` trusts a public test seed for `@jig`.
        # Dev-dependencies may enable them; no crate's normal or build graph
        # may, or a release binary would register a test suite (JEP-0001).
        run: |
          if cargo tree --workspace -e normal,build,features \
              | grep -E 'jig-core feature "(test-suite|test-default-authority)"|jig-mls feature "conformance"'; then
            echo "::error::a normal dependency enables a test-only feature"
            exit 1
          fi
      - name: Format (v0.0.2 surface)
        # Scoped to v0.0.2-touched crates. jig-spec may still have
        # upstream formatting drift and is not gated. jig-bridge-email is
        # first-class (alpha.email rewrote it as an in-process library), and
        # jig-runtime joined the gate when the byte-payload convention landed
        # there — it is verified clean, and it is no longer a crate we can afford
        # to leave unchecked now that block execution lives in it.
        run: |
          cargo fmt --check \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-mls \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Clippy (v0.0.2 surface)
        # Every workspace crate, no allowlist gaps.
        #
        # jig-server, jig-nameserver and jig-cli were the last three missing, and
        # their absence was self-perpetuating: debt accumulated precisely because
        # nothing checked them (~24 findings by the time it was measured — 16
        # field_reassign_with_default, a too_many_arguments, dead code, unused
        # imports). That is cleared, so the gap closes here rather than being
        # documented again.
        run: |
          cargo clippy \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-mls \
            -p jig-runtime \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            --all-targets \
            -- -D warnings
      - name: No normal build enables jig-pipeline's test-support
        # test-support compiles BlockExecutor::shared, which signs operator
        # policies with a public test key; only [dev-dependencies] may enable it.
        run: |
          ! cargo tree --locked -e normal,features -i jig-pipeline --workspace \
            | grep 'feature "test-support"'
      - name: Clippy (jig-bridge-core web feature)
        # The webhook-mount path (RouterMount + cfg'd BridgeContext field) is
        # gated behind the `web` feature; lint it explicitly so it's covered.
        run: cargo clippy -p jig-bridge-core --all-targets --features web -- -D warnings
      - name: Clippy (jig-bridge-email)
        # alpha.email's in-process EmailBridge. --all-targets so its substantial
        # test modules (provider/inbound/outbound/bridge) are linted too.
        run: cargo clippy -p jig-bridge-email --all-targets -- -D warnings
      - name: Nextest (v0.0.2 surface)
        # No exclusions. The WASI fuel golden used to be filtered out here because
        # it pinned one host's fuel number (18098 on the aarch64 macOS where it was
        # generated, 1713 on this x86_64 runner). #33 established that the spread
        # tracks the host OS rather than the architecture, and is confined to WASI
        # modules — which jig refuses to load anyway. That test now bounds WASI
        # fuel instead of pinning it, so it runs everywhere; the no-imports
        # fixture, whose fuel IS portable, still asserts its exact value.
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-mls \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Nextest (jig-bridge-core web feature)
        run: cargo nextest run -p jig-bridge-core --features web

  wasm-build:
    name: wasm-build (text-block, wasm32-unknown-unknown)
    # Same rule as `workspace`.
    needs: changes
    if: >-
      ${{ !cancelled() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        (needs.changes.result != 'success' || needs.changes.outputs.code == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Swatinem/rust-cache saves to the Actions cache API.
      actions: write
    steps:
      - uses: actions/checkout@v7
      # Builds for wasm32-unknown-unknown (listed in rust-toolchain.toml), NOT
      # wasm32-wasip1. text-block is a pure function; the unknown-unknown target
      # emits a module with no imports, which is what lets jig-runtime
      # instantiate it under a no-imports policy. A wasip1 build imports
      # wasi_snapshot_preview1 and gets rejected at load.
      - name: Install pinned toolchain (rust-toolchain.toml)
        # Channel, components and targets all come from rust-toolchain.toml at
        # the repo root, so CI builds with exactly what a contributor gets.
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
          key: wasm32-unknown-unknown
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      # The committed artifact is what jig-pipeline embeds and executes, so it
      # must stay faithful to this source. It is checked by FUNCTIONAL
      # equivalence, not byte-identity.
      #
      # Byte-identity was tried and does not work: Wasm output here is not
      # reproducible across hosts. An identical tree built on aarch64 macOS and
      # on this runner differs by ~1.4 KB under the same rustc 1.97.1, and
      # `--remap-path-prefix` does not close the gap. It is not even stable
      # across target-directory states on one machine.
      #
      # So: rebuild (build-artifact.sh enforces no floats, no imports, required
      # exports, declared memory max), then run jig-runtime's payload suite twice
      # — once against the committed artifact, once against the fresh build.
      # Both runs assert agreement with text-block's native `execute_pure`, which
      # makes it the shared oracle. A source change that alters rendering fails
      # the fresh run while the committed artifact still passes its own, which is
      # exactly the drift this needs to catch.
      # Step order matters: build-artifact.sh OVERWRITES the committed artifact,
      # so the committed artifact has to be exercised before that happens.
      - name: Committed artifact behaves correctly
        working-directory: repos
        run: cargo test -p jig-runtime --test text_block_payload
      # The same check for the jig:block/renderer component (JEP-0006): it passes jig-core's
      # component validator, agrees with `execute_pure`, and keeps the module's render_hash.
      # build-artifact.sh rebuilds it too, so it is exercised here first for the same reason.
      - name: Committed component behaves correctly
        working-directory: repos
        run: cargo test -p jig-runtime --test text_block_component
      - name: Rebuild the canonical artifact (enforces structural invariants)
        working-directory: repos
        run: ./text-block/build-artifact.sh
      - name: Fresh build behaves identically
        working-directory: repos
        env:
          JIG_TEXT_BLOCK_WASM: target/wasm32-unknown-unknown/release/text_block.wasm
        run: cargo test -p jig-runtime --test text_block_payload
      - name: Fresh component behaves identically
        working-directory: repos
        env:
          JIG_TEXT_BLOCK_COMPONENT: target/wasm32-unknown-unknown/release/text_block.component.wasm
        run: cargo test -p jig-runtime --test text_block_component

  # Nightly checks that `workspace` leaves out to keep pull request and queue
  # runs short. The nightly skips itself when no Rust source changed in the
  # previous day. Not a required check: a red nightly means fix forward, it does
  # not gate merges.
  # - Doc tests. Nextest does not run them, so a broken example in a doc comment
  #   never turns `workspace` red; one already sat broken on main for a while
  #   (jig-config's validation.rs). jig-cli is left out because it has no
  #   library target for `--doc` to test.
  # - jig-runtime's `tracing` feature, which no default build enables, so a
  #   warning or a break behind it would otherwise go unseen.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Swatinem/rust-cache saves to the Actions cache API.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The skip check below reads the last day of history.
          fetch-depth: 0
      - name: Did any Rust source change since the previous nightly?
        id: changed
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # 25h, not 24h, so a late-starting cron run never misses a commit.
          if git log --since='25 hours ago' --format=%H -- \
              repos rust-toolchain.toml ':(exclude,glob)**/*.md' | grep -q .; then
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "No Rust source changed since the previous nightly; skipping."
            echo "run=false" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: repos
      - name: Doc tests (v0.0.2 surface)
        if: steps.changed.outputs.run == 'true'
        run: |
          cargo test --doc \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-mls \
            -p jig-server \
            -p jig-nameserver \
            -p jig-runtime \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Clippy, jig-runtime with the tracing feature
        # Runs even when the doc tests failed, so one red step never hides the other.
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        run: cargo clippy -p jig-runtime --all-targets --features tracing -- -D warnings

  # Renamed from `license-compliance`: bare `cargo deny check` runs ALL FOUR
  # checks (advisories, bans, licenses, sources). The old name once sent a
  # failure investigation at the licenses check when the actual red was
  # advisories. Name the job after what it runs.
  dependency-policy:
    name: dependency-policy (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        # Channel, components and targets all come from rust-toolchain.toml at
        # the repo root, so CI builds with exactly what a contributor gets.
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check (advisories, bans, licenses, sources)
        # deny.toml lives at the repo root; Cargo.toml lives at repos/Cargo.toml.
        # Run from root and point cargo deny at the workspace manifest explicitly.
        # Running from inside repos/ makes cargo-deny silently fall back to its
        # DEFAULT config (allows no licenses, ignores nothing) — do not "fix"
        # this by dropping the working-directory override.
        working-directory: .
        run: cargo deny --manifest-path repos/Cargo.toml check
