name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The RustSec advisory DB moves independently of this repo, so a brand-new
  # advisory against an untouched dependency would otherwise first surface as a
  # red build on whatever unrelated PR happens to run next (this has already
  # happened once). Run the dependency-policy job on its own cadence against the
  # default branch so drift is attributed to the advisory DB, not a contributor.
  # NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
  schedule:
    - cron: '17 7 * * *'  # daily 07:17 UTC; off-the-hour to dodge cron peak queueing

# All cargo invocations expect to be run from the `repos/` workspace root.
# The dependency-policy job is the exception — `deny.toml` lives at the repo root.
defaults:
  run:
    working-directory: repos

# jig-nameserver's config tests require this env var to construct.
# Test value is fine; CI doesn't talk to a real nameserver.
env:
  JIG_NS_SECRET: ci_dummy_jig_ns_secret_not_a_real_value

jobs:
  workspace:
    # The scheduled run exists only to re-check the advisory DB; skip the
    # expensive build/test matrix on that trigger.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Format (v0.0.2 surface)
        # Scoped to v0.0.2-touched crates. Pre-existing legacy crates
        # (jig-runtime, jig-spec, jig-gui/*) may have upstream formatting
        # drift; not gating on those here. jig-bridge-email is now first-class
        # (alpha.email rewrote it as an in-process library) so it's gated.
        run: |
          cargo fmt --check \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Clippy (v0.0.2 surface)
        # All clippy lints enforced; alpha.1c #10 cleaned up the legacy
        # v0.0.1 lint debt that the previous `-A` mute list was carrying.
        run: |
          cargo clippy \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -- -D warnings
      - name: Clippy (jig-bridge-core web feature)
        # The webhook-mount path (RouterMount + cfg'd BridgeContext field) is
        # gated behind the `web` feature; lint it explicitly so it's covered.
        run: cargo clippy -p jig-bridge-core --all-targets --features web -- -D warnings
      - name: Clippy (jig-bridge-email)
        # alpha.email's in-process EmailBridge. --all-targets so its substantial
        # test modules (provider/inbound/outbound/bridge) are linted too.
        run: cargo clippy -p jig-bridge-email --all-targets -- -D warnings
      - name: Nextest (v0.0.2 surface)
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p text-block \
            -p integration-tests \
            -p jig-bridge-core \
            -p jig-bridge-email
      - name: Nextest (jig-bridge-core web feature)
        run: cargo nextest run -p jig-bridge-core --features web

  wasm-build:
    name: wasm-build (text-block, wasm32-wasip1)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
          key: wasm32-wasip1
      - name: Build text-block (wasm32-wasip1)
        run: cargo build --release --target wasm32-wasip1 -p text-block
      - name: Verify wasm artifact exists
        working-directory: .
        run: test -f repos/target/wasm32-wasip1/release/text_block.wasm

  # Renamed from `license-compliance`: bare `cargo deny check` runs ALL FOUR
  # checks (advisories, bans, licenses, sources). The old name once sent a
  # failure investigation at the licenses check when the actual red was
  # advisories. Name the job after what it runs.
  dependency-policy:
    name: dependency-policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check (advisories, bans, licenses, sources)
        # deny.toml lives at the repo root; Cargo.toml lives at repos/Cargo.toml.
        # Run from root and point cargo deny at the workspace manifest explicitly.
        # Running from inside repos/ makes cargo-deny silently fall back to its
        # DEFAULT config (allows no licenses, ignores nothing) — do not "fix"
        # this by dropping the working-directory override.
        working-directory: .
        run: cargo deny --manifest-path repos/Cargo.toml check
