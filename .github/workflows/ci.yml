name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# All cargo invocations expect to be run from the `repos/` workspace root.
# License compliance is the exception — `deny.toml` lives at the repo root.
defaults:
  run:
    working-directory: repos

# jig-nameserver's config tests require this env var to construct.
# Test value is fine; CI doesn't talk to a real nameserver.
env:
  JIG_NS_SECRET: ci_dummy_jig_ns_secret_not_a_real_value

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Format (v0.0.2 surface)
        # Scoped to v0.0.2-touched crates. Pre-existing legacy crates
        # (jig-runtime, jig-spec, jig-email-bridge, jig-gui/*) may have
        # upstream formatting drift; not gating on those here.
        run: |
          cargo fmt --check \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p text-block \
            -p integration-tests
      - name: Clippy (v0.0.2 surface)
        run: |
          cargo clippy \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p text-block \
            -p integration-tests \
            -- -D warnings
      - name: Nextest (v0.0.2 surface)
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run \
            -p jig-core \
            -p jig-config \
            -p jig-pipeline \
            -p jig-client \
            -p jig-server \
            -p jig-nameserver \
            -p jig-cli \
            -p text-block \
            -p integration-tests

  wasm-build:
    name: wasm-build (text-block, wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
          key: wasm32-wasip1
      - name: Build text-block (wasm32-wasip1)
        run: cargo build --release --target wasm32-wasip1 -p text-block
      - name: Verify wasm artifact exists
        working-directory: .
        run: test -f repos/target/wasm32-wasip1/release/text_block.wasm

  jig-server-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: telemetry
            features: "telemetry_v0_2"
          - name: duckdb
            features: "analytics_duckdb"
          - name: parquet
            features: "analytics_parquet"
          - name: clickhouse
            features: "analytics_clickhouse"
    # These exercise pre-v0.0.2 jig-server feature flags. v0.0.2 didn't
    # audit them; allowed to fail without blocking the PR until we
    # explicitly take them on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Clippy (jig-server ${{ matrix.name }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo clippy -p jig-server -- -D warnings
          else
            cargo clippy -p jig-server --features "${{ matrix.features }}" -- -D warnings
          fi
      - name: Nextest (jig-server ${{ matrix.name }})
        run: |
          cargo install cargo-nextest --locked
          if [ -z "${{ matrix.features }}" ]; then
            cargo nextest run -p jig-server
          else
            cargo nextest run -p jig-server --features "${{ matrix.features }}"
          fi

  e2e-receipt:
    runs-on: ubuntu-latest
    # Pre-existing legacy transport receipt script; not v0.0.2 path.
    # Surface as advisory until we either port to the v0.0.2 surface
    # or retire it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xxd
      - name: Run transport receipt path
        working-directory: .
        run: bash repos/integration-tests/transport-tests/receipt_path.sh

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License check
        # deny.toml lives at the repo root.
        working-directory: .
        run: cargo deny check
