name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings
      - name: Nextest (workspace)
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run --workspace

  jig-server-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: telemetry
            features: "telemetry_v0_2"
          - name: duckdb
            features: "analytics_duckdb"
          - name: parquet
            features: "analytics_parquet"
          - name: clickhouse
            features: "analytics_clickhouse"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (jig-server ${{ matrix.name }})
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo clippy -p jig-server -- -D warnings
          else
            cargo clippy -p jig-server --features "${{ matrix.features }}" -- -D warnings
          fi
      - name: Nextest (jig-server ${{ matrix.name }})
        run: |
          cargo install cargo-nextest --locked
          if [ -z "${{ matrix.features }}" ]; then
            cargo nextest run -p jig-server
          else
            cargo nextest run -p jig-server --features "${{ matrix.features }}"
          fi

  e2e-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xxd
      - name: Run transport receipt path
        run: bash repos/integration-tests/transport-tests/receipt_path.sh

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License check
        run: cargo deny check
