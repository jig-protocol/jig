# cargo-deny configuration for jig-protocol workspace
# Enforces license compliance and dependency policies.
#
# Schema follows cargo-deny v0.19+ (PR #611): the legacy `unlicensed` and
# top-level `deny` keys are gone. License gating now happens via the
# `allow` allowlist — anything not listed is rejected. GPL-2.0/GPL-3.0
# remain implicitly denied by their absence below.

[licenses]
# Workspace crates may be unlicensed during early development; license
# policy enforces the *dependency* graph. Internal crates skip license
# checks via [licenses.private].
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",  # cranelift/wasmtime
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",  # Boost Software License
    "ISC",  # ISC License (OpenBSD)
    "0BSD",  # Zero-Clause BSD
    "Zlib",  # Zlib License
    "Unicode-3.0",  # Unicode License
    "Unicode-DFS-2016",  # Unicode Data Files
    "CDDL-1.0",  # CDDL (SQLite/RocksDB optional backend)
    "CDLA-Permissive-2.0",  # Community Data License
    "MPL-2.0",  # transient via dirs/option-ext
]
confidence-threshold = 0.8

# Allow internal gigue private crates and workspace crates
[licenses.private]
ignore = true
registries = ["gigue-internal"]


[bans]
multiple-versions = "warn"
wildcards = "allow"

# rustls 0.23's DEFAULT crypto provider is aws-lc-rs, which needs cmake and a C
# toolchain. Every rustls/tokio-rustls dependency in this workspace therefore sets
# `default-features = false` and selects `ring` explicitly — but that is a
# convention, and a convention only holds until someone adds a dependency that
# pulls rustls with defaults on.
#
# Two things go wrong when it slips, and neither is a compile error:
#   - the one-line install and the Raspberry Pi target acquire a C build;
#   - with BOTH providers enabled, `ClientConfig::builder()` panics at RUNTIME
#     ("no process-level CryptoProvider available") rather than failing to build.
#
# Denying it makes the graph enforce what the comments ask for.
deny = [{ name = "aws-lc-sys" }, { name = "aws-lc-rs" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# RustSec advisory database checks (cargo-deny v2 schema).
#
# INVARIANT: every id below must still match a crate in the current graph.
# A suppression whose crate has left the tree is worse than useless — if that
# crate ever returns transitively the advisory is silently re-muted instead of
# being re-evaluated. cargo-deny reports these as `advisory-not-detected`
# ("no crate matched advisory criteria"); treat any such warning as a bug in
# this file and delete the entry.
#
# Every id is pinned individually (never glob-suppressed) so a NEW advisory
# landing against our dep graph still fails CI and forces a deliberate call.
# Each entry carries the crate it suppresses and why it is acceptable today.
#
# Last audited against the graph: 2026-10-05 (post wasmtime 47.0.4 -> 48.0.5
# for RUSTSEC-2026-0314/0315/0316 and 0321-0327, and rustls 0.23.31 -> 0.23.45+
# for RUSTSEC-2026-0285; before that, 2026-09-11, post wasmtime 47.0.3 -> 47.0.4
# for RUSTSEC-2026-0268/0269 and the chacha20 0.10.0 yank; before that,
# 2026-08-05, post cid 0.10 -> 0.11 / multihash 0.18 -> 0.19, which dropped
# core2 and proc-macro-error from the graph; before that, post wasmtime
# 24.0.12 -> 47.0.3, which closed the six
# wasmtime advisories outright and — via the transitive minimums that bump
# forced — also retired the fxhash and bytes entries).
[advisories]
version = 2
# The yanked transitive dep inherited from the v0.0.1 baseline was core2, via
# cid 0.10 -> multihash 0.18. cid 0.11 pairs with multihash 0.19, which moved
# the hashers out to multihash-codetable and dropped core2 with them, so the
# graph now resolves with no yanked crates and this is enforced rather than
# merely reported. (The sha3/keccak the previous note lumped in here never
# came from multihash at all — they arrive via the optional `sigstore`
# feature -> picky, and are not yanked.)
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 (paste, unmaintained) left with ratatui 0.27. ratatui
    # 0.30 uses pastey instead, so the advisory no longer matches a crate.

    # atty (RUSTSEC-2021-0145, RUSTSEC-2024-0375) left with the unused jig-cli
    # dependency. Nothing in the crate called it; terminal detection is
    # std::io::IsTerminal when a caller actually needs it.


    # The three "fixable by a lockfile bump" entries that used to sit here
    # (RUSTSEC-2026-0009 time, RUSTSEC-2025-0055 tracing-subscriber,
    # RUSTSEC-2026-0097 rand) are GONE, not moved: later lockfile changes carried
    # the fixes and nobody pruned the notes. cargo-deny was already reporting all
    # three as `advisory-not-detected`, and removing them leaves `advisories ok`.
    #
    # That warning is how to tell a live ignore from a dead one — the comments
    # rot, the tool does not:
    #   cargo deny --manifest-path repos/Cargo.toml check advisories \
    #     2>&1 | grep -B6 "no crate matched"

    # The five entries that used to sit here — RUSTSEC-2025-0134 (rustls-pemfile)
    # and the four rustls-webpki ones (2026-0049/0098/0099/0104) — are gone,
    # resolved rather than re-annotated. All five were blocked on the same thing:
    # the tree carried rustls 0.22 (via tokio-tungstenite 0.21) alongside 0.23
    # (via reqwest), and the 0.22 branch pulled rustls-webpki 0.102.x, which only
    # a >=0.103.12 fixes. Unifying on rustls 0.23 removed the 0.102 copy, and
    # rustls-pemfile went with it (rustls-pki-types parses PEM itself).

    # --- No wasmtime entries. jig-runtime + jig-server are on wasmtime 48.0.5,
    #     which carries fixes for every wasmtime advisory currently published
    #     against our graph — including RUSTSEC-2026-0096 (aarch64 Cranelift
    #     miscompiled guest heap access -> sandbox escape), which had no fix on
    #     the 24.x line and was previously carved out on the premise that
    #     jig-runtime only executes blocks we author. That premise no longer has
    #     to hold; do not reintroduce a wasmtime suppression here without one. ---
]
