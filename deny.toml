# cargo-deny configuration for jig-protocol workspace
# Enforces license compliance and dependency policies.
#
# Schema follows cargo-deny v0.19+ (PR #611): the legacy `unlicensed` and
# top-level `deny` keys are gone. License gating now happens via the
# `allow` allowlist — anything not listed is rejected. GPL-2.0/GPL-3.0
# remain implicitly denied by their absence below.

[licenses]
# Workspace crates may be unlicensed during early development; license
# policy enforces the *dependency* graph. Internal crates skip license
# checks via [licenses.private].
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",  # cranelift/wasmtime
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",  # Boost Software License
    "ISC",  # ISC License (OpenBSD)
    "0BSD",  # Zero-Clause BSD
    "Zlib",  # Zlib License
    "Unicode-3.0",  # Unicode License
    "Unicode-DFS-2016",  # Unicode Data Files
    "CDDL-1.0",  # CDDL (SQLite/RocksDB optional backend)
    "CDLA-Permissive-2.0",  # Community Data License
    "MPL-2.0",  # transient via dirs/option-ext
]
confidence-threshold = 0.8

# Allow internal gigue private crates and workspace crates
[licenses.private]
ignore = true
registries = ["gigue-internal"]


[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# RustSec advisory database checks (cargo-deny v2 schema).
#
# INVARIANT: every id below must still match a crate in the current graph.
# A suppression whose crate has left the tree is worse than useless — if that
# crate ever returns transitively the advisory is silently re-muted instead of
# being re-evaluated. cargo-deny reports these as `advisory-not-detected`
# ("no crate matched advisory criteria"); treat any such warning as a bug in
# this file and delete the entry.
#
# Every id is pinned individually (never glob-suppressed) so a NEW advisory
# landing against our dep graph still fails CI and forces a deliberate call.
# Each entry carries the crate it suppresses and why it is acceptable today.
#
# Last audited against the graph: 2026-08-05 (post cid 0.10 -> 0.11 /
# multihash 0.18 -> 0.19, which dropped core2 and proc-macro-error from the
# graph; before that, post wasmtime 24.0.12 -> 47.0.3, which closed the six
# wasmtime advisories outright and — via the transitive minimums that bump
# forced — also retired the fxhash and bytes entries).
[advisories]
version = 2
# The yanked transitive dep inherited from the v0.0.1 baseline was core2, via
# cid 0.10 -> multihash 0.18. cid 0.11 pairs with multihash 0.19, which moved
# the hashers out to multihash-codetable and dropped core2 with them, so the
# graph now resolves with no yanked crates and this is enforced rather than
# merely reported. (The sha3/keccak the previous note lumped in here never
# came from multihash at all — they arrive via the optional `sigstore`
# feature -> picky, and are not yanked.)
yanked = "deny"
ignore = [
    # --- build-time only: proc macros, never linked into a shipped binary ---
    "RUSTSEC-2024-0436",  # paste unmaintained; via ratatui -> jig-cli. Build-time only, no runtime surface.

    # --- jig-cli-local, non-network ---
    "RUSTSEC-2021-0145",  # atty unaligned read (unsound); via jig-cli. Windows-only AND only under a custom global allocator, which we do not install.
    "RUSTSEC-2024-0375",  # atty unmaintained; same jig-cli dep. Superseded by std::io::IsTerminal — swap when jig-cli's arg parsing is next touched.

    # --- unmaintained, no safe upgrade published ---
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained; jig-server TLS cert loading + rustls-native-certs. Thin wrapper over rustls-pki-types; migrate with the tokio-tungstenite 0.21 bump.

    # --- fixable by a lockfile bump; deliberately NOT done in this change
    #     because this lane may not touch Cargo.lock. Tracked as followups. ---
    "RUSTSEC-2026-0009",  # time RFC-2822 parse stack exhaustion; via hickory-resolver + jig-core. We do not parse attacker-supplied RFC 2822 dates today; fix is time >=0.3.47.
    "RUSTSEC-2025-0055",  # tracing-subscriber ANSI escape injection into logs; jig-server/jig-nameserver. Log poisoning only, no memory safety; fix is tracing-subscriber >=0.3.20.
    "RUSTSEC-2026-0097",  # rand ThreadRng unsound with a custom log::Logger; our own workspace rand 0.8 dep. We install no custom logger that draws randomness; fix is rand >=0.8.6.

    # --- rustls-webpki (both 0.102.8 via rustls 0.22 and 0.103.4 via rustls 0.23).
    #     All four need webpki >=0.103.12/0.103.13, i.e. rustls 0.23 everywhere —
    #     blocked on the tokio-tungstenite 0.21 -> newer bump that removes the
    #     rustls 0.22 branch. We do not use CRLs or name constraints today. ---
    "RUSTSEC-2026-0049",  # CRL distributionPoint matching; we perform no CRL revocation checking.
    "RUSTSEC-2026-0098",  # URI-name constraints wrongly accepted; we issue no name-constrained CAs.
    "RUSTSEC-2026-0099",  # wildcard name constraints wrongly accepted; same, no name-constrained CAs.
    "RUSTSEC-2026-0104",  # reachable panic parsing a CRL; unreachable while no CRLs are supplied.

    # --- No wasmtime entries. jig-runtime + jig-server are on wasmtime 47.0.3,
    #     which carries fixes for every wasmtime advisory currently published
    #     against our graph — including RUSTSEC-2026-0096 (aarch64 Cranelift
    #     miscompiled guest heap access -> sandbox escape), which had no fix on
    #     the 24.x line and was previously carved out on the premise that
    #     jig-runtime only executes blocks we author. That premise no longer has
    #     to hold; do not reintroduce a wasmtime suppression here without one. ---
]
