[package]
name = "jig-server"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Jig Protocol Contributors"]
description = "Reference server implementation for Jig protocol"
repository = "https://github.com/jig-protocol/jig-server"
keywords = ["messaging", "server", "federation"]
categories = ["network-programming"]

[[bin]]
name = "jig-server"
path = "src/main.rs"

[dependencies]
# Core protocol
jig-core = { path = "../jig-core" }
jig-runtime = { workspace = true }
jig-config = { workspace = true }
jig-bridge-core = { path = "../bridges/core", features = ["web"] }
jig-bridge-email = { path = "../bridges/email" }

# v0.0.2 hello-world milestone — pipeline + client + new config sections
jig-pipeline = { path = "../jig-pipeline" }
jig-client   = { path = "../jig-client" }
shellexpand  = "3"

# Async runtime
tokio = { workspace = true }
tokio-util = "0.7"
futures = "0.3"

# Database
rusqlite = { workspace = true }

# Web framework
axum = { version = "0.7", features = ["ws"] }
# tower 0.5 to match the dev-deps entry below; having both 0.4 and 0.5 in the
# same crate confuses rustc's crate resolution (E0464 multiple candidates).
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
humantime-serde = "1.1"
cid.workspace = true

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"

# Time
chrono = "0.4"
time = { version = "0.3", features = ["formatting"] }

# UUID
uuid = { version = "1.6", features = ["v7", "serde"] }

# Federation
ed25519-dalek = { workspace = true }
rand = { workspace = true }
base64 = "0.21"
blake3 = { workspace = true }
hex = { workspace = true }
futures-util = "0.3"
semver = "1.0"
hickory-resolver = { version = "0.26", features = ["tokio"] }
reqwest = { workspace = true }

# WebSocket + TLS, all pinned to ONE rustls major (0.23).
#
# Carrying both 0.22 (via tokio-tungstenite 0.21) and 0.23 (via reqwest) meant
# two rustls-webpki copies, and the 0.102.x one carried four advisories that only
# a >=0.103.12 webpki fixes. Removing the 0.22 branch removes them.
#
# `default-features = false` + explicit `ring` is NOT optional: rustls 0.23's
# DEFAULT provider feature is `aws-lc-rs`, which is a C build (cmake/NASM) at odds
# with the one-line-install and Raspberry Pi targets. Worse, if both providers end
# up enabled, `ClientConfig::builder()` panics at runtime with no process-level
# CryptoProvider rather than failing to compile. deny.toml bans aws-lc-sys so a
# future bump cannot reintroduce it quietly.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-pki-types = "1.0"
dashmap = "5"
jsonwebtoken = "10"
wasmtime = { version = "48.0.5", features = ["async"] }

# Capability enforcement (Phase 1)
hmac = "0.12"
sha2 = "0.10"

# Async traits (used by v0.0.2 bridge trait impls)
async-trait = "0.1"

# TLS serving — reuses the rustls 0.23 / tokio-rustls 0.26 pulled by
# tokio-tungstenite (federation WSS) and reqwest. Still hand-wired over hyper-util
# rather than axum-server: that would pull rustls with DEFAULT features, i.e.
# aws-lc-rs, reintroducing the C build this deliberately avoids.
#
# rustls-pemfile is gone (it was unmaintained, RUSTSEC-2025-0134). It was a thin
# wrapper over rustls-pki-types, which parses PEM itself.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }

[dev-dependencies]
tempfile = "3.8"
rcgen = "0.13"

[features]
default = ["sqlite"]
sqlite = []
