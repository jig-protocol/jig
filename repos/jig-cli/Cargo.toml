[package]
name = "jig-cli"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jig Protocol Contributors"]
description = "CLI client for Jig messaging protocol"
repository = "https://github.com/jig-protocol/jig-cli"
keywords = ["messaging", "cli", "chat", "irc"]
categories = ["command-line-utilities"]

[[bin]]
name = "jig"
path = "src/main.rs"

[features]
default = ["local-runtime"]
# The block runtime: `jig block run`, and checking each message against its
# server's exec receipt (jig-client's `verify`).
local-runtime = ["jig-runtime", "jig-client/verify"]

[dependencies]
# Core protocol
# `ed25519` opens and verifies v0.3 receipts (`jig receipt`).
jig-core = { path = "../jig-core", features = ["ed25519"] }
jig-runtime = { workspace = true, optional = true }
# Shared client library (added v0.0.2 C5).
jig-client = { path = "../jig-client" }
# Passphrases typed at the terminal are cleared from memory after use.
zeroize = "1"
# MLS commit type, carried between jig-client's session and the blocks the CLI
# submits for it.
jig-mls = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Async
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP client
reqwest = { workspace = true }

# Base64 for alias-registration proof-of-control signatures
base64 = "0.23"

# URL parsing (validates `jig server set <url>` input)
url = "2"

# Core helpers
cid.workspace = true
semver = "1.0"

# `jig block build` and `lint`: wrap a core module as a component in-process (the version
# wasmtime 49 already uses), and read core modules to explain determinism violations.
wit-component = "0.261"
wasmparser = "0.261"
rustc-demangle = "0.1"
blake3.workspace = true

# Utils
dirs = "7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
whoami = "2.1"

# Terminal UI (`jig chat`). ratatui 0.29 still depends on lru 0.12
# (GHSA-rhfx-m35p-ff5j, fixed in lru 0.16.3). 0.30 dropped lru.
# Its default crossterm backend is crossterm 0.29, so the direct
# dependency has to match or the event types diverge.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
# `TestNameserver`: the real nameserver router, for `tests/nameserver_roundtrip.rs`.
integration-tests = { path = "../integration-tests" }
# Lets tests resolve `@jig` under the placeholder authority; never in a build.
jig-core = { path = "../jig-core", features = ["test-default-authority"] }
tempfile = "3.8"
wat = "1.0"
time = { version = "0.3", features = ["serde"] }
ed25519-dalek = { workspace = true }
