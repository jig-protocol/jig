[package]
name = "jig-cli"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jig Protocol Contributors"]
description = "CLI client for Jig messaging protocol"
repository = "https://github.com/jig-protocol/jig-cli"
keywords = ["messaging", "cli", "chat", "irc"]
categories = ["command-line-utilities"]

[[bin]]
name = "jig"
path = "src/main.rs"

[features]
default = ["local-runtime"]
# Gate daemon code that may require Send/Sync for DB connections
daemon = []
local-runtime = ["jig-runtime"]

[dependencies]
# Core protocol
jig-core = { path = "../jig-core" }
jig-runtime = { workspace = true, optional = true }
# Shared client library (added v0.0.2 C5). Used by Phase F's new commands
# (`jig init`, `jig send`, `jig tail`, `jig chat`). Existing jig-cli code
# paths (e.g., src/http_client.rs) stay as legacy until Phase F replaces
# them with jig-client-backed equivalents.
jig-client = { path = "../jig-client" }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Async
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP client
reqwest = { workspace = true }

# Base64 for alias-registration proof-of-control signatures
base64 = "0.22"

# URL parsing (validates `jig server set <url>` input)
url = "2"

# Core helpers
cid.workspace = true
semver = "1.0"

# Utils
dirs = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
whoami = "1.4"

# Terminal UI (`jig chat`). ratatui 0.29 still depends on lru 0.12
# (GHSA-rhfx-m35p-ff5j, fixed in lru 0.16.3). 0.30 dropped lru.
# Its default crossterm backend is crossterm 0.29, so the direct
# dependency has to match or the event types diverge.
ratatui = "0.30"
crossterm = "0.29"

# Config (planned integration)
jig-config = { path = "../jig-config", optional = true }

[dev-dependencies]
tempfile = "3.8"
time = { version = "0.3", features = ["serde"] }
ed25519-dalek = { workspace = true }
