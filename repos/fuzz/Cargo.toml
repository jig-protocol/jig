[package]
name = "jig-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "cargo-fuzz targets for what jig decodes from the network"

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds it with nightly and sanitizer flags,
# which the main workspace must never see.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
ed25519-dalek = "3.0"
jig-core = { path = "../jig-core", features = ["ed25519"] }
jig-pipeline = { path = "../jig-pipeline" }
jig-mls = { path = "../jig-mls" }
jig-runtime = { path = "../jig-runtime" }
jig-server = { path = "../jig-server", features = ["fuzzing"] }

[profile.release]
debug = 1

[[bin]]
name = "dcbor"
path = "fuzz_targets/dcbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cose"
path = "fuzz_targets/cose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ingest_record"
path = "fuzz_targets/ingest_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer_frames"
path = "fuzz_targets/peer_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mls_delivery"
path = "fuzz_targets/mls_delivery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mls_group"
path = "fuzz_targets/mls_group.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_component"
path = "fuzz_targets/wasm_component.rs"
test = false
doc = false
bench = false
