[package]
name = "jig-bridge-email"
version = "0.0.3"
edition = "2024"
authors = ["Jig Protocol Contributors"]
license = "MIT"
description = "Email bridge for Jig protocol (jig-bridge-email; bidirectional SMTP/IMAP gateway)"
repository = "https://github.com/jig-protocol/jig"

[dependencies]
# Core dependencies — note paths now go up two levels (bridges/email/ → repos/)
jig-core = { path = "../../jig-core" }
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email handling
lettre = { version = "0.11", default-features = false, features = ["tokio1", "smtp-transport", "builder", "tokio1-rustls-tls"] }
mail-parser = "0.9"
async-trait = "0.1"

# Outbound via Resend (optional)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Storage
rusqlite = { workspace = true }

# Configuration
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.6", features = ["v4"] }
semver = { version = "1.0", features = ["serde"] }

# DNS discovery
hickory-resolver = { version = "0.26", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.10"
