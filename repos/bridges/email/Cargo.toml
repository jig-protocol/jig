[package]
name = "jig-bridge-email"
version = "0.0.3"
edition = "2024"
authors = ["Jig Protocol Contributors"]
license = "MIT OR Apache-2.0"
description = "Email bridge for Jig protocol — in-process library loaded by jig-server"
repository = "https://github.com/jig-protocol/jig"

[dependencies]
jig-bridge-core = { path = "../core", features = ["web"] }
jig-core = { workspace = true }
jig-client = { path = "../../jig-client" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
