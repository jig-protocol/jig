[package]
name = "jig-bridge-email"
version = "0.0.3"
edition = "2024"
authors = ["Jig Protocol Contributors"]
license = "MIT"
description = "Email bridge for Jig protocol — in-process library loaded by jig-server"
repository = "https://github.com/jig-protocol/jig"

[dependencies]
jig-bridge-core = { path = "../core", features = ["web"] }
jig-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
