[package]
name = "jig-bridge-core"
version = "0.0.3"
edition = "2024"
authors = ["Jig Protocol Contributors"]
license = "AGPL-3.0-only"
description = "Common Bridge trait + context types for jig-protocol bridges (email, slack, irc, ssh, ...)"
repository = "https://github.com/jig-protocol/jig"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# Workspace tokio is trimmed to the minimal needed set (rt-multi-thread, macros,
# net, time, sync, signal, io-util). jig-bridge-core only needs "sync" at the
# library level; cargo unifies the workspace set automatically so no override needed.
tokio = { workspace = true }
axum = { workspace = true, optional = true }

[features]
# HTTP-capable bridges (email webhook, future REST bridges) opt in. Non-HTTP
# bridges (e.g. a future IRC bridge) skip the axum dependency entirely.
web = ["dep:axum"]

[dev-dependencies]
tokio = { workspace = true }
