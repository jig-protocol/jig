[package]
name = "jig-config"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Server configuration types for Jig"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = "7"
# [tls]: the rustls config, and the self-signed certificate made on first start.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rcgen = "0.14"

[dev-dependencies]
tempfile = "3"
