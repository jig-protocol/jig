[package]
name = "jig-runtime"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Unified WASM runtime for Jig Protocol with deterministic execution, WASI support, capability sandboxing, and instrumented fuel metering"
repository = "https://github.com/jig-protocol/repos"
keywords = ["wasm", "runtime", "wasi", "capabilities", "deterministic"]

[features]
default = ["wasi-preview2"]
component-model = ["wasmtime/component-model"]
wasi-preview2 = ["wasmtime-wasi"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Core
anyhow = "1.0"
thiserror = "2.0"

# WASM Runtime
wasmtime = { version = "50.0.0", features = ["cranelift", "pooling-allocator"] }
wasmtime-wasi = { version = "50.0.0", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Cryptography
blake3 = "1.5"

# Logging (optional)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

chrono = { workspace = true, features = ["serde"] }
jig-core = { path = "../jig-core" }
cid.workspace = true
multihash-codetable.workspace = true
time = { version = "0.3", features = ["serde"] }

[dev-dependencies]
# Pulley, for tests/block_abi_vectors.rs, which runs every vector on both backends. Test builds
# only: nothing in the shipped runtime selects Pulley yet.
wasmtime = { version = "50.0.0", features = ["pulley"] }
wat = "1.0"
# For tests/text_block_component.rs, which runs the real canonical component.
# text-block depends on no workspace crate, so this adds no cycle; jig-runtime
# does not depend on it outside tests.
text-block = { path = "../text-block" }
# The block ABI codec; the test encodes Input and decodes Output host-side.
postcard = { workspace = true }
