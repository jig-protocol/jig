[package]
name = "jig-runtime"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Unified WASM runtime for Jig Protocol with deterministic execution, WASI support, capability sandboxing, and instrumented fuel metering"
repository = "https://github.com/jig-protocol/repos"
keywords = ["wasm", "runtime", "wasi", "capabilities", "deterministic"]

[features]
default = ["deterministic", "wasi-preview2"]
deterministic = []
component-model = ["wasmtime/component-model"]
wasi-preview2 = ["wasmtime-wasi"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
receipt-signing = ["dep:ed25519-dalek"]

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"

# WASM Runtime
wasmtime = { version = "47.0.4", features = ["cranelift", "pooling-allocator"] }
wasmtime-wasi = { version = "47.0.4", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Cryptography
blake3 = "1.5"
ed25519-dalek = { version = "3.0", optional = true }

# Logging (optional)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Async (for future async API)
tokio = { version = "1.35", features = ["sync"], optional = true }
chrono = { workspace = true, features = ["serde"] }
jig-core = { path = "../jig-core" }
cid.workspace = true
multihash-codetable.workspace = true
time = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["rt", "macros"] }
wat = "1.0"
# For tests/text_block_payload.rs, which runs the real canonical module through
# the byte-payload convention. text-block depends on no workspace crate, so this
# adds no cycle; jig-runtime does not depend on it outside tests.
text-block = { path = "../text-block" }
# The block ABI codec; the test encodes Input and decodes Output host-side.
postcard = { workspace = true }
