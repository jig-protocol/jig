# Rustfmt configuration for Riverdance
edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4

# Import organization
imports_granularity = "Module"
reorder_imports = true
group_imports = "StdExternalCrate"

# Code style
newline_style = "Unix"
use_small_heuristics = "Max"
wrap_comments = true
comment_width = 80

# Function formatting
fn_params_layout = "Tall"
where_single_line = true

# Match formatting
match_block_trailing_comma = true
trailing_comma = "Vertical"

# String formatting
format_strings = true

# Macro formatting
format_macro_matchers = true

# Chain formatting
chain_width = 80