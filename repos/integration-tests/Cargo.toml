[package]
name = "integration-tests"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
jig-runtime = { workspace = true }
jig-server = { path = "../jig-server" }
jig-nameserver = { path = "../jig-nameserver" }
jig-client = { path = "../jig-client" }
jig-pipeline = { path = "../jig-pipeline" }
jig-core = { workspace = true }
jig-config = { workspace = true }
jig-bridge-core = { path = "../bridges/core", features = ["web"] }
jig-bridge-email = { path = "../bridges/email" }
tokio = { workspace = true }
axum = { workspace = true }
# tower 0.5 to match jig-server's dep (workspace default is 0.4; a mixed
# 0.4+0.5 resolution causes E0464 duplicate crate in the same compilation unit).
tower = { version = "0.5", features = ["util"] }
async-trait = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
anyhow = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
# Native reference for render_hash expectations. H1 asserts the receipt's hash
# equals what `execute_pure` derives for the submitted body, rather than merely
# that the field is populated — jig-runtime's payload tests pin this native
# function to the Wasm module, which is what makes it a valid oracle here.
text-block = { path = "../text-block" }
tokio-tungstenite = "0.21"
futures-util = "0.3"
semver = "1.0"

[dev-dependencies]
wat = "1.0"
# alpha.1c #4 (h_tls_verifier): drive a real TLS handshake against a
# self-signed cert to verify dangerously_disable_federation_tls.
rcgen = "0.13"
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pki-types = "1.0"
