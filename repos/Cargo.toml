[workspace]
members = [
    "jig-core",
    "jig-server", 
    "jig-cli",
    "jig-nameserver",
    "jig-runtime",
    # Archived (WASM-only runtime): jig-wasmtime, jig-podman, jig-docker, jig-runtime-select
    "hello-wasm",
    "jig-config",
    "integration-tests",
    "jig-gui/riverdance/ui",
    "jig-gui/riverdance/web",
    "jig-gui/riverdance/desktop",
    "jig-gui/riverdance/mobile",
    "jig-gui/riverdance/api",
    "text-block",
    "jig-pipeline",
    "jig-client",
    "bridges/*",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
# Floor set by wasmtime 48.x. Inherited by jig-runtime and jig-server via
# `rust-version.workspace = true`; other members do not opt in, so this is not
# a workspace-wide assertion. The toolchain itself is pinned in
# rust-toolchain.toml, which is comfortably above it. Cargo still reports the
# offending transitive crates
# rather than this floor when a toolchain is too old, so the value here is the
# declaration itself, not a friendlier error.
rust-version = "1.95"
authors = ["Jig Protocol Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jig-protocol/jig"
homepage = "https://jig.onl"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jig-core = { path = "jig-core", features = ["ed25519"] }
jig-config = { path = "jig-config" }
jig-runtime = { path = "jig-runtime" }
# Riverdance GUI
dioxus = "0.6.0"
ui = { path = "jig-gui/riverdance/ui" }
api = { path = "jig-gui/riverdance/api" }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Wire codec for the Wasm block ABI.
#
# NOT serde_json, deliberately. serde_json's number parser drags f64 code into
# every module that links it (`f64_from_parts`, `parse_number`,
# `parse_exponent_overflow`), and jig-core's determinism validator rejects any
# module containing float instructions — so a JSON ABI made the canonical
# text-block unrunnable even though its types hold no floats. postcard keeps
# `#[derive(Serialize, Deserialize)]` ergonomics for block authors, emits zero
# float instructions, and is more compact. Codec choice does not affect
# `render_hash`, which is computed over the canonical text, not the encoded bytes.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Crypto
ed25519-dalek = "3.0"
x25519-dalek = "2.0"
blake3 = "1.5"
rand = "0.10"
hex = "0.4"

# Content addressing. `cid` and `multihash` must move together: `cid` 0.11
# re-exports `multihash` 0.19, and a `Multihash` from a different major is a
# different type. `multihash` 0.19 dropped the hasher code table into the
# separate `multihash-codetable` crate, which is where `Code`/`MultihashDigest`
# now live. Declared workspace-wide so a future bump cannot half-land: block
# CIDs are the protocol's content addresses and must stay byte-identical.
cid = { version = "0.11", features = ["serde"] }
multihash-codetable = { version = "0.2", default-features = false, features = ["blake3"] }

# Storage
# 0.32 pairs with libsqlite3-sys 0.30, which is what sqlx 0.8.1+ (GHSA-xmrp-424f-vfpx)
# resolves. 0.31 cannot share a process with that sqlx line: both crates `links = "sqlite3"`.
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Networking
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"
http-body-util = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v7", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Debug info for dependencies only, not our own crates.
#
# The wasmtime tree (cranelift, pulley, wasm-tools, zstd, rayon) is enormous,
# and integration-tests builds 12 separate binaries that each statically link
# all of it. With full debug info on those rlibs, linking several at once
# exhausted the GitHub runner and `ld` died with SIGBUS. Our own crates keep
# `debug = true`, so backtraces through jig code are unaffected.
[profile.dev.package."*"]
debug = false
