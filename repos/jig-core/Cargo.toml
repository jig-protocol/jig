[package]
name = "jig-core"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jig Protocol Contributors"]
description = "Core protocol implementation for Jig messaging"
repository = "https://github.com/jig-protocol/jig-core"
keywords = ["messaging", "protocol", "encryption", "federation"]
categories = ["network-programming", "cryptography"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.6"
time = { version = "0.3", features = ["serde", "formatting"] }
semver = { version = "1.0", features = ["serde"] }
blake3 = "1.5"
data-encoding = "2"
cid.workspace = true
multihash-codetable.workspace = true
hex = "0.4"
base64 = "0.23"
thiserror = "2.0"
wasmparser = "0.255"

# Optional cryptography/signing helpers
ed25519-dalek = { version = "3.0", optional = true, features = ["serde"] }
rand = { version = "0.10", optional = true }
# Clears the seed buffer in `crypto::ed25519::generate_signing_key`. Already in
# the tree via curve25519-dalek, so this adds a Cargo.toml line, not a build.
zeroize = { version = "1", optional = true }

[dev-dependencies]
proptest = "1.0"
wat = "1.0"

[features]
default = []
ed25519 = ["ed25519-dalek", "rand", "zeroize"]
