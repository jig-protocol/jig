[package]
name = "jig-pipeline"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Shared block ingest/effect/persist pipeline for jig-server and jig-nameserver"

[dependencies]
jig-core = { workspace = true }
jig-config = { workspace = true }
jig-runtime = { workspace = true }
# The canonical text-render block: its embedded Wasm artifact, its module
# identity, and the Input/Output types that define the ABI. Depending on the
# crate rather than re-declaring the types keeps one definition of the wire
# shape — a mismatch here would decode as garbage rather than fail to compile.
text-block = { path = "../text-block" }
# The block ABI codec. NOT serde_json: its number parser links f64 code, which
# jig-core's determinism validator rejects. See the workspace-level comment.
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"
proptest = "1.4"
rand = { workspace = true }
semver = { version = "1.0", features = ["serde"] }
