# Example nameserver config with multiple rulesets and translation contracts
[nameserver]
profile = "federated"

[nameserver.network]
bind = "0.0.0.0"
port = 8070
public_url = "https://ns.example.net"

[nameserver.storage]
database_path = "/var/lib/jig/ns.db"

[nameserver.pow]
server_secret = "prod-secret-must-rotate"
base_difficulty = 18
min_difficulty = 10
max_difficulty = 30

[nameserver.rate_limits]
per_key_per_min = 20
per_ip_per_min = 60

[nameserver.reputation]
default_ruleset = "high-sec"

[[nameserver.reputation.local_rulesets]]
key = "high-sec"
description = "Shared high-sec contract"
authority = "did:jig:central"
weight = 1.0

[nameserver.reputation.local_rulesets.pow_policy]
min_bits = 14
max_bits = 28
multiplier = 1.0

[[nameserver.reputation.local_rulesets]]
key = "partner-qa"
description = "Partner quality assurance sandbox"
authority = "did:partner:qa"
weight = 0.4

[nameserver.reputation.local_rulesets.pow_policy]
min_bits = 10
max_bits = 24
multiplier = 0.8

[[nameserver.reputation.translation_contracts]]
from = "partner-qa"
to = "high-sec"
weight = 0.6
[nameserver.reputation.translation_contracts.transform]
type = "linear"
slope = 0.5
intercept = 0.0

[[nameserver.reputation.translation_contracts]]
from = "legacy-null"
to = "high-sec"
weight = 0.2
[nameserver.reputation.translation_contracts.transform]
type = "table"
entries = [
  { min = -1.0, max = -0.2, mapped = -0.6 },
  { min = -0.2, max = 0.4, mapped = -0.1 },
  { min = 0.4, max = 1.0, mapped = 0.4 }
]
default = 0.0

[nameserver.federation]
enabled = true
seed_peers = [
  "https://ns-alpha.example.com",
  "https://ns-beta.example.org"
]
max_peers = 50
allow_domains = []  # Empty = allow all
deny_domains = []   # Block specific domains
cache_ttl_secs = 3600
gossip_interval_secs = 300  # 5 minutes
handshake_timeout_secs = 30
gossip_batch_size = 100
