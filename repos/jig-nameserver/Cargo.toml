[package]
name = "jig-nameserver"
version = "0.0.1"
edition = "2024"
authors = ["Jig Protocol Contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
# Workspace-shared deps
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["derive", "env"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7", "serde"] }
rusqlite = { workspace = true }
ed25519-dalek = { workspace = true }
# For challenge nonces and PoW salts only. Identity keygen goes through
# `jig_core::crypto::ed25519::generate_signing_key` — do not mint a signing key
# from this dependency. (`jig-client` has no `rand` at all for that reason; the
# nameserver still needs it for the non-key randomness above.)
rand = { workspace = true }
blake3 = { workspace = true }
axum = { workspace = true, features = ["macros"] }
tower = { workspace = true, features = ["make", "util"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
async-trait = { workspace = true }
hex = { workspace = true }

reqwest = { workspace = true }
urlencoding = "2"
toml = "1.1"

# Profiling tools (only needed for perf binary, not core nameserver)
hdrhistogram = { version = "7", optional = true }
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
dirs = "7"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
cid.workspace = true
jig-config = { workspace = true }
jig-core = { workspace = true }

# v0.0.2 hello-world milestone
jig-pipeline = { path = "../jig-pipeline" }
jig-client = { path = "../jig-client" }
shellexpand = "3"
base64 = "0.23"

[dev-dependencies]
# Paused time for the registration pool's queue tests.
tokio = { workspace = true, features = ["test-util"] }
jig-client = { path = "../jig-client", features = ["test-support"] }
serde_json = { workspace = true }
http-body-util = { workspace = true }
semver = { version = "1.0", features = ["serde"] }

[features]
default = []
# Profiling tools for performance analysis (not needed for core nameserver)
profiling = ["dep:hdrhistogram", "dep:pprof"]

[[bin]]
name = "jig-nameserver-perf"
path = "src/bin/perf.rs"
required-features = ["profiling"]

[package.metadata.nextest]
# Allow cargo-nextest to run tests in parallel safely
profile = { default = { test-threads = 4 } }
