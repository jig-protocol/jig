[package]
name = "text-block"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Canonical text-render Wasm block for jig-protocol v0.0.2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# See the workspace-level comment: serde_json would make this module fail
# jig-core's determinism validation, because its number parser links f64 code.
postcard = { workspace = true }
unicode-normalization = "0.1"
blake3 = { workspace = true }

[dev-dependencies]
proptest = "1.4"
