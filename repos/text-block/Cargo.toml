[package]
name = "text-block"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Canonical text-render Wasm block for jig-protocol v0.0.2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# See the workspace-level comment: serde_json would make this module fail
# jig-core's determinism validation, because its number parser links f64 code.
postcard = { workspace = true }
unicode-normalization = "0.1"
blake3 = { workspace = true }
# Guest bindings for the `jig:block` renderer world, used only by the component build
# (`--features component`, see build-artifact.sh). 0.51 is the version already in the lockfile.
wit-bindgen = { version = "0.57", optional = true }

[features]
# The `jig:block/renderer@0.1.0` exports (JEP-0006). build-artifact.sh builds the core module
# with this, then wraps it as a component; host builds leave it off, so they don't compile
# wit-bindgen.
component = ["dep:wit-bindgen"]

[dev-dependencies]
proptest = "1.4"
