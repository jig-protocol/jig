[package]
name = "jig-client"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Client library for jig-protocol: WSS connection, identity loading, bundle construction"

[dependencies]
# `keystore`: identity keys and MLS state sealed at rest (I1).
jig-core = { workspace = true, features = ["keystore"] }
jig-pipeline = { path = "../jig-pipeline" }
# The client half of MLS: group state, encrypt/decrypt (`secure`).
jig-mls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# TLS is declared here, not inherited: without an explicit feature a standalone
# `cargo build -p jig-cli` yields a CLI that cannot dial wss://. It only appeared
# to work inside the workspace because jig-server unified the feature in.
# Pinned to the same rustls major as jig-server (0.23). jig-client was the second
# holder of the rustls 0.22 branch, so bumping only the server would have left
# rustls-webpki 0.102.x — and its four advisories — in the tree.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
futures-util = "0.3"
# TLS bound to the server's DID (`tls`): one verifier for REST (reqwest) and
# WSS (tokio-tungstenite), both on rustls 0.23 with ring, like jig-server.
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
url = "2"
dirs = "7"
# No `rand` dependency, deliberately. Identity keygen goes through
# `jig_core::crypto::ed25519::generate_signing_key`, and this crate previously
# minted long-lived keyfiles from its own `rand::rng()`. Leaving the dep out
# makes that regression a compile error rather than a review catch.
base64 = "0.23"
semver = { version = "1.0", features = ["serde"] }
# Identity keys and MLS state at rest: the opened key is held in `Zeroizing`.
zeroize = "1"

# The OS keychain, as a `.jigkey` slot (I1). The native store on macOS only:
# Linux reaches the Secret Service through the `secret-tool` command instead,
# which keeps an async D-Bus stack out of every build (DJ, 2026-10-18), and
# Windows is not a release target yet, so it uses the passphrase.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[features]
# Run a block's component here and compare with the server's `exec` receipt
# (JEP-0006 step 7). The runtime and the text-block component come through
# jig-pipeline, which already links both.
verify = []

[dev-dependencies]
tempfile = "3"
# `verify` tests sign real exec receipts with the pipeline's test executor.
jig-pipeline = { path = "../jig-pipeline", features = ["test-support"] }
# `naming` tests stand up real TLS servers: one under a test CA, one
# self-signed, to show `dns` discovery takes a CA-valid certificate only. Same
# rustls stack as above (0.23, ring), as integration-tests uses.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
