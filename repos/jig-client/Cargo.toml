[package]
name = "jig-client"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Client library for jig-protocol: WSS connection, identity loading, bundle construction"

[dependencies]
jig-core = { workspace = true }
jig-pipeline = { path = "../jig-pipeline" }
jig-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# TLS is declared here, not inherited: without an explicit feature a standalone
# `cargo build -p jig-cli` yields a CLI that cannot dial wss://. It only appeared
# to work inside the workspace because jig-server unified the feature in.
# Pinned to the same rustls major as jig-server (0.23). jig-client was the second
# holder of the rustls 0.22 branch, so bumping only the server would have left
# rustls-webpki 0.102.x — and its four advisories — in the tree.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
futures-util = "0.3"
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
url = "2"
dirs = "5"
# No `rand` dependency, deliberately. Identity keygen goes through
# `jig_core::crypto::ed25519::generate_signing_key`, and this crate previously
# minted long-lived keyfiles from its own `rand::rng()`. Leaving the dep out
# makes that regression a compile error rather than a review catch.
base64 = "0.22"
semver = { version = "1.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
