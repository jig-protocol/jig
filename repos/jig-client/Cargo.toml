[package]
name = "jig-client"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license = "MIT"
description = "Client library for jig-protocol: WSS connection, identity loading, bundle construction"

[dependencies]
jig-core = { workspace = true }
jig-pipeline = { path = "../jig-pipeline" }
jig-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.21"
futures-util = "0.3"
ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
url = "2"
dirs = "5"
rand = { workspace = true }
base64 = "0.22"
semver = { version = "1.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
